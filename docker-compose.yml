services:
  vapt-auditor:
    build: .
    container_name: vapt-auditor
    restart: unless-stopped
    # Published on all interfaces, port 8080 -- and login auth is currently
    # disabled app-wide (see README "Access control"). Anyone who can reach
    # this port can use the scanner with no login. If that's not intended,
    # bind to "127.0.0.1:8080:8000" instead and put a reverse proxy/VPN in
    # front, or re-enable auth.
    ports:
      - "8080:8000"
    environment:
      # Inert while auth is disabled -- see README "Access control".
      - VAPT_ADMIN_USER=${VAPT_ADMIN_USER:-admin}
      - VAPT_ADMIN_PASSWORD=${VAPT_ADMIN_PASSWORD:-password}
      # Optional: enables CVE-level WordPress plugin/theme lookups.
      - WPSCAN_API_TOKEN=${WPSCAN_API_TOKEN:-}
    volumes:
      - ./data:/srv/app/data
      - ./uploads:/srv/app/uploads
    # nmap OS detection / some NSE scripts need raw sockets.
    cap_add:
      - NET_RAW
      - NET_ADMIN
